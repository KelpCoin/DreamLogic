name: Retired DreamLogic Archive Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify no legacy deploy path and no stale checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          for p in (".github/workflows/pages.yml",".github/workflows/deploy.yml",".github/workflows/force-pages-dispatch.yml"):
              s=Path(p).read_text()
              assert "on:" in s and "workflow_dispatch:" in s,p
              for forbidden in ("deploy-pages@", "upload-pages-artifact@", "RENDER_DEPLOY_HOOK_URL","push:"):
                  assert forbidden not in s,p
          for p in ("index.html","engine.html","proofs.html","ip.html"):
              s=Path(p).read_text()
              assert "https://dreamledger.org/" in s,p
              assert "buy.stripe.com" not in s,p
              assert "BEC-PRIME" not in s,p
              assert "Elohim" not in s,p
          assert "retired" in Path("README.md").read_text().lower()
          print(json.dumps({"schema":"dreamlogic/retired-archive-gauntlet/v1","verdict":"PASS","economic_truth":"UNVERIFIED","deployment_authority":False},sort_keys=True))
          PY
