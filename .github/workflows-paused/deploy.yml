name: Archived Render Deployment (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm archive-only status
        run: |
          echo "RETIRED_REPOSITORY_DEPLOYMENT_DISABLED=PASS"
          echo "NO_RENDER_DEPLOY_NO_GITHUB_PAGES_PUBLISH"
