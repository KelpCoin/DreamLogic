name: DreamLedger CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamledger-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify
        run: npm run verify

      - name: Enforce silo boundaries
        run: node scripts/silo-integrity.js

      - name: Write CI proof
        if: always()
        run: |
          mkdir -p proof
          cat > proof/ci-proof.json <<'JSON'
          {
            "commit": "${{ github.sha }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "status": "${{ job.status }}"
          }
          JSON
          cat proof/ci-proof.json

      - name: Upload CI proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-proof-${{ github.run_id }}
          path: proof/ci-proof.json
          if-no-files-found: error
