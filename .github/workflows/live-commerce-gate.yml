name: Live Commerce Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-commerce:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production MTG route
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://dreamledger.org/mtg -o /tmp/mtg.html
          grep -q 'mtg.html' /tmp/mtg.html

      - name: Verify production offers endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://dreamledger.org/api/offers -o /tmp/offers.json
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/offers.json', 'utf8');
          const data = JSON.parse(raw);
          const offers = Array.isArray(data) ? data : (Array.isArray(data.offers) ? data.offers : []);
          if (!offers.length) throw new Error('Production offers endpoint returned zero offers');
          const diagnostic = offers.find(x => String(x.id || x.offer_id || x.product_id || '').includes('COMMANDER-DECK-DIAGNOSTIC-001'));
          if (!diagnostic) throw new Error('COMMANDER-DECK-DIAGNOSTIC-001 not present in production offers');
          console.log(`PASS production offers=${offers.length}`);
          console.log(`PASS commander diagnostic present`);
          NODE

      - name: Emit proof summary
        run: |
          echo "LIVE_COMMERCE_GATE=PASS"
          echo "MTG_ROUTE=https://dreamledger.org/mtg"
          echo "OFFERS=https://dreamledger.org/api/offers"
          echo "EDH_0001=NOT_REQUIRED_FOR_THIS_GATE"
          echo "PAYMENT=NOT_VERIFIED_BY_THIS_GATE"
