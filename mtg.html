<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DreamLedger | MTG</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#05070b;color:#eef}
main{max-width:1200px;margin:auto;padding:32px 20px}
a{color:#7ee7ff;text-decoration:none}
.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px 2px 28px}
.card{flex:0 0 300px;scroll-snap-align:start;border:1px solid #28384d;border-radius:18px;padding:16px;background:#0b1018;box-sizing:border-box}
.photo{width:100%;height:210px;border-radius:12px;background:#111a25;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain}
.muted{color:#9baabd}
.buy{display:block;width:100%;margin-top:14px;padding:12px 16px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}
.buy:disabled{opacity:.55;cursor:wait}
.error{padding:16px;border:1px solid #6b2630;border-radius:12px;color:#ffb4bd;background:#210d11}
</style>
</head>
<body>
<main>
<p><a href="/">DreamLedger</a></p>
<h1>MTG Catalogue</h1>
<p class="muted">Live MTG offers. Swipe horizontally to browse.</p>
<section id="deck-carousel-container" aria-label="MTG catalogue"><p class="muted">Loading live catalogue...</p></section>
</main>
<script>
(function(){
  const container=document.getElementById('deck-carousel-container');
  function esc(value){return String(value==null?'':value).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]});}
  function buyOffer(offerId,button){
    button.disabled=true;
    button.textContent='Opening checkout...';
    fetch('/api/offer-checkout/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({offer_id:offerId,region:'NZ'})})
      .then(function(res){return res.json().then(function(data){return {ok:res.ok,data:data};});})
      .then(function(result){
        if(!result.ok || !result.data.url) throw new Error(result.data.error || 'No checkout URL returned');
        window.location.href=result.data.url;
      })
      .catch(function(err){button.disabled=false;button.textContent='Buy Now';alert('Checkout failed: '+err.message);});
  }
  fetch('/api/offers')
    .then(function(res){if(!res.ok) throw new Error('Offers API returned HTTP '+res.status);return res.json();})
    .then(function(offers){
      const items=offers.filter(function(p){return p && String(p.silo||'').toUpperCase()==='MTG' && p.status==='published' && p.checkout_available;});
      if(!items.length){container.innerHTML='<p class="muted">No published MTG offers are currently available.</p>';return;}
      const rail=document.createElement('div');rail.className='rail';
      items.forEach(function(item){
        const card=document.createElement('article');card.className='card';
        const price=item.prices && item.prices.NZ ? item.prices.NZ.amount : null;
        card.innerHTML='<div class="photo"><span class="muted">MTG</span></div>'+
          '<h2>'+esc(item.name||item.id)+'</h2>'+
          '<p class="muted">MTG offer</p>'+
          '<p><strong>'+(price==null?'Price unavailable':'NZ$ '+esc(price))+'</strong></p>'+
          '<button class="buy" type="button">Buy Now</button>';
        card.querySelector('.buy').addEventListener('click',function(){buyOffer(item.id,this);});
        rail.appendChild(card);
      });
      container.replaceChildren(rail);
    })
    .catch(function(err){container.innerHTML='<div class="error">Unable to load the live MTG catalogue: '+esc(err.message)+'</div>';});
})();
</script>
</body>
</html>
